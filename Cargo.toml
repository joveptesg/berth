[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/joveptesg/berth"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
