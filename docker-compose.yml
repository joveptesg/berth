# Berth with its data in ./data (database, backups, local storage, secret.key).
#
# Update:    docker compose pull && docker compose up -d
#            (the new version backs the database up to ./data/backups before migrating)
# Roll back: pin the previous version in `image` (e.g. ghcr.io/joveptesg/berth:1.0.0),
#            then restore the backup made before the update:
#            docker compose stop berth
#            docker compose run --rm berth admin restore /data/backups/auto-<time>.sqlite
#            docker compose up -d
# From source: uncomment `build` and run docker compose up -d --build
services:
  berth:
    image: ghcr.io/joveptesg/berth:1
    # build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data