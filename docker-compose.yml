# Berth with its data in ./data (database, backups, local storage, secret.key).
#
# Update:    git pull && docker compose up -d --build
#            (the new version backs the database up to ./data/backups before migrating)
# Roll back: check out the previous version, then restore the backup made before the update:
#            docker compose stop berth
#            docker compose run --rm berth admin restore /data/backups/auto-<time>.sqlite
#            docker compose up -d --build
services:
  berth:
    image: berth:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data