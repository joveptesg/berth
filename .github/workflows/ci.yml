name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with CONTRIBUTING.md.
  TAILWIND_VERSION: v4.3.3

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  admin-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild the committed admin CSS
        run: |
          curl -fsSL -o tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x tailwindcss
          cd crates/berth-server
          ../../tailwindcss -i assets/css/admin.css -o assets/static/admin.css --minify
      - name: Fail if the committed CSS is stale
        run: git diff --exit-code -- crates/berth-server/assets/static/admin.css

  build:
    runs-on: ubuntu-latest
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - run: target/x86_64-unknown-linux-musl/release/berth openapi > openapi.json
      - uses: actions/upload-artifact@v7
        with:
          name: openapi.json
          path: openapi.json
      - uses: actions/upload-artifact@v7
        with:
          name: berth-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/berth

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by in every commit
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
