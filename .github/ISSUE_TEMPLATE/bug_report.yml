name: Bug report
description: Something in Berth does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash or image tag.
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage
      options:
        - Local disk
        - S3-compatible
        - Google Drive
        - Not related to storage
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs berth`. Remove secrets and setup links.
      render: text
