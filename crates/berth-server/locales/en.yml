  step_storage: Storage
  storage_hint: Where audiobook files are kept. You can add other storage and switch to it later.
  step_password: Admin password
  name_label: Server name
  name_hint: Shown in the app when someone connects.
  password_label: Password
  confirm_label: Repeat password
  password_hint: At least %{min} characters. Reset it later with berth admin reset-password on the server.
  submit: Finish setup
  locked: Set in berth.toml or environment

login:
  title: Sign in
  subtitle: Admin of %{name}
  password_label: Admin password
  submit: Sign in
