backup:
  section: Backup
  now_title: Database backup
  now_hint: A copy of the library, users, devices, progress and settings as of now. Audio files are not in it — they stay in the storages.
  download: Download database backup
  key_title: Server key (secret.key)
  key_hint: It encrypts the storage keys in the database and signs device tokens. It is not in the database backup — download it once and keep it apart from the backups (in a password manager, say). Without it, a backup restored on a new server cannot read its S3/R2 keys.
  key_where: "On the server:"
  key_download: Download secret.key
  delete_one: Delete
  delete_confirm: Delete this automatic backup?
  auto_title: Automatic backups
  auto_hint: The server saves a copy before every database schema update. The last %{keep} are kept.
  auto_empty: No automatic backups yet — the first appears with the first server update.
  download_one: Download
  restore_one: Restore
  restore_title: Restore from a file
  restore_hint: Upload a backup downloaded from this server before. The current database is saved to the automatic backups first, so a restore can be undone the same way. You may have to sign in again afterwards.
  restore_submit: Restore
  restore_confirm: Replace the whole database with the backup? The current state is saved to the automatic backups.
  restored: The database was restored from the backup. The state before the restore is in the automatic backups.
  restore_section: Restore
  restore_pick: Choose a backup file (.sqlite)
  restore_auto_title: Restore an automatic backup
  restore_auto_hint: Copies the server made itself before updates and restores.
  col_date: Date
  col_size: Size
  col_actions: Actions
