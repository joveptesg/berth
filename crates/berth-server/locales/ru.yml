  save: Сохранить
  saved: Сохранено
  optional: необязательно
  version: Версия %{version}

nav:
  dashboard: Обзор
  users: Пользователи
  devices: Устройства
  storage: Хранилища
  settings: Настройки
  logout: Выйти
  menu: Меню
  close: Закрыть меню
  theme: Тема
  theme_light: Светлая
  theme_dark: Тёмная
  theme_system: Как в системе
  language: Язык

setup:
  title: Настройка сервера
  subtitle: Четыре шага — и Berth готов к аудиокнигам вашей семьи.
  step_token: Ссылка настройки
  step_token_done: Открыта с токеном из лога сервера
  step_name: Название сервера
  step_storage: Хранилище
  storage_hint: Где лежат файлы аудиокниг. Позже можно добавить другие хранилища и переключиться на них.
  step_password: Пароль администратора
  name_label: Название сервера
  name_hint: Его увидят в приложении при подключении.
  password_label: Пароль
  confirm_label: Повторите пароль
  password_hint: Не короче %{min} символов. Сбросить можно командой berth admin reset-password на сервере.
  submit: Завершить настройку
  locked: Задано в berth.toml или переменной окружения

login:
  title: Вход
  subtitle: Администратор сервера %{name}
  password_label: Пароль администратора
  submit: Войти
  forgot: Забыли? Выполните berth admin reset-password на сервере.
  not_configured: Сервер ещё не настроен. Откройте ссылку настройки из лога сервера.

dashboard:
  title: Обзор
  subtitle: Всё, что происходит на сервере %{name}
  empty_title: Библиотек пока нет
  empty_body: Загрузка книг — следующий шаг. А пока проверьте название и адреса сервера в настройках.
  open_settings: Открыть настройки
  server_card: Сервер
  version_card: Версия

settings:
  title: Настройки
  subtitle: Название, адреса и доступ к серверу %{name}
  server_section: Сервер
  server_hint: Приложение получает оба адреса в QR-коде и само переключается между ними.
  name_label: Название сервера
  lan_label: Адрес в домашней сети
  lan_hint: например, http://192.168.0.4:8080
  wan_label: Адрес в интернете
  wan_hint: например, https://books.example.com
  password_section: Пароль администратора
  password_hint: После смены выйдут остальные ваши браузеры.
  current_label: Текущий пароль
  new_label: Новый пароль
  confirm_label: Повторите новый пароль
  password_saved: Пароль изменён
  password_submit: Сменить пароль

users:
  title: Пользователи
  subtitle: Вы и те, кто слушает книги на этом сервере. У слушателей нет пароля — их телефоны подключаются по коду.
  add_title: Добавить слушателя
  add_hint: Затем покажите QR-код, чтобы подключить его телефон.
  name_label: Имя
  name_placeholder: например, Анна
  add_submit: Добавить и подключить
  role_owner: Администратор
  role_admin: Администратор
  role_member: Слушатель
  role_restricted: С ограничениями
  devices: "Устройств: %{count}"
  connect_phone: Подключить телефон
  cancel: Отмена

connect:
  qr_label: QR-код для приложения Berth
  scan_hint: В Berth на телефоне нажмите «Сканировать QR» или «Ввести код» и наберите адрес и код ниже.
  code_label: Код
  expires_in: Истекает через
  waiting: Ждём телефон…
  addresses_label: Адреса в QR-коде
  fallback_hint: Адреса не заданы, поэтому в QR — адрес этой страницы. Укажите адреса домашней сети и интернета в разделе
  connected_title: Телефон подключён
  connect_another: Подключить ещё
  open_devices: К устройствам
  expired_title: Код истёк
  expired_body: Ничего не подключено. Покажите новый код и отсканируйте его в течение двух минут.
  new_code: Новый код
  close: Закрыть

devices:
  title: Устройства
  subtitle: Телефоны, подключённые к этому серверу.
  empty: Устройств пока нет.
  browser: Браузер
  paired: Подключено
  last_seen: Был в сети
  revoke: Отозвать
  revoke_confirm: Отозвать «%{name}»? Приложение выйдет и удалит загрузки и библиотеку.

storage:
  title: Хранилища
  subtitle: Где лежат файлы аудиокниг. Новые книги попадают в хранилище по умолчанию.
  add_title: Добавить хранилище
  edit_title: Изменить хранилище
  add_hint: "Папка на этом сервере или любой S3-совместимый бакет: AWS, Cloudflare R2, Backblaze B2, MinIO, Yandex Object Storage."
  add_submit: Добавить хранилище
  kind_label: Тип
  kind_local: Папка на сервере
  kind_local_hint: Файлы лежат рядом с Berth, и он сам их отдаёт.
  kind_s3: S3-бакет
  kind_s3_hint: AWS, R2, B2, MinIO, Yandex и другие S3-совместимые.
  name_label: Название
  name_placeholder: например, Домашний диск
  path_label: Папка
  path_hint: "Абсолютный путь или путь относительно папки данных:"
  endpoint_label: Адрес сервиса (endpoint)
  endpoint_hint: Для AWS S3 оставьте пустым.
  bucket_label: Бакет
  region_label: Регион
  region_hint: auto для Cloudflare R2; пусто — us-east-1.
  access_key_label: Идентификатор ключа
  secret_key_label: Секретный ключ
  keys_hint: Хранятся зашифрованными ключом сервера (secret.key) и больше не показываются.
  keys_keep_hint: Оставьте оба поля пустыми, чтобы не менять сохранённые ключи.
  keys_saved: сохранён
  path_style_label: Адреса в стиле path
  path_style_hint: endpoint/бакет вместо бакет.endpoint. Обычно нужно для MinIO.
  delivery_label: Доставка в приложения
  delivery_hint: Прямые ссылки снимают нагрузку с сервера. Через сервер — если телефоны не достают до бакета.
  delivery: Доставка
  delivery_presigned: Прямые ссылки
  delivery_proxy: Через сервер
  delivery_cdn: CDN
  status: Проверка
  verified: Пройдена
  unchecked: Ещё не проверялось
  default: По умолчанию
  verify: Проверить
  verifying: Проверяем…
  make_default: Сделать по умолчанию
  edit: Изменить
  delete: Удалить
  delete_confirm: Удалить «%{name}»? Удаляется только профиль, файлы остаются на месте.
  footnote: Проверка записывает, читает и удаляет маленький тестовый файл.

errors:
  name_required: Введите название сервера.
  name_too_long: Слишком длинное название (не больше 64 символов).
  lan_url_invalid: Введите полный адрес, начиная с http:// или https://.
  wan_url_invalid: Введите полный адрес, начиная с http:// или https://.
  password_too_short: Слишком короткий пароль.
  password_mismatch: Пароли не совпадают.
  password_wrong: Неверный пароль.
  user_name_required: Введите имя.
  user_name_too_long: Слишком длинное имя (не больше 64 символов).
  storage_name_required: Введите название.
  storage_name_too_long: Слишком длинное название (не больше 64 символов).
  storage_name_taken: Хранилище с таким названием уже есть.
  storage_kind_invalid: Выберите папку или S3-бакет.
  storage_path_required: Укажите папку.
  storage_bucket_required: Укажите бакет.
  storage_endpoint_invalid: Введите полный адрес, начиная с http:// или https://, и правильное название бакета.
  storage_delivery_invalid: Выберите способ доставки.
  storage_keys_required: Укажите оба ключа.
  storage_is_default: Хранилище по умолчанию удалить нельзя. Сначала сделайте основным другое.
  storage_in_use: "Здесь хранятся книги: его нельзя удалить или перенести."
  storage_auth_failed: Ключи не приняты. Проверьте идентификатор и секретный ключ.
  storage_access_denied: "Доступ запрещён: с этими ключами нельзя писать в бакет."
  storage_bucket_not_found: Бакет не найден. Проверьте название, регион и адрес.
  storage_unreachable: Хранилище не отвечает. Проверьте адрес и сеть.
  storage_mismatch: "Тестовый файл вернулся другим: хранилище портит данные."
  storage_local_unwritable: Berth не может писать в эту папку. Проверьте путь и права.
  storage_failed: Проверка не прошла. Подробности — в логе сервера.
