  password_saved: Пароль изменён
  password_submit: Сменить пароль
  about_section: О сервере
  version_label: Версия сервера

users:
  title: Пользователи
  subtitle: Вы и те, кто слушает книги на этом сервере. У слушателей нет пароля — их телефоны подключаются по коду.
  add_title: Добавить слушателя
  add_hint: Затем покажите QR-код, чтобы подключить его телефон.
  name_label: Имя
  name_placeholder: например, Анна
  add_submit: Добавить и подключить
  role_owner: Администратор
  role_admin: Администратор
  role_member: Слушатель
  role_restricted: С ограничениями
  devices: "Устройств: %{count}"
  connect_phone: Подключить телефон
  cancel: Отмена

connect:
  qr_label: QR-код для приложения Berth
  scan_hint: В Berth на телефоне нажмите «Сканировать QR» или «Ввести код» и наберите адрес и код ниже.
  code_label: Код
  expires_in: Истекает через
  waiting: Ждём телефон…
  addresses_label: Адреса в QR-коде
  fallback_hint: Адреса не заданы, поэтому в QR — адрес этой страницы. Укажите адреса домашней сети и интернета в разделе
  connected_title: Телефон подключён
  connect_another: Подключить ещё
  open_devices: К устройствам
  expired_title: Код истёк
  expired_body: Ничего не подключено. Покажите новый код и отсканируйте его в течение двух минут.
  new_code: Новый код
  close: Закрыть

devices:
  title: Устройства
  subtitle: Телефоны, подключённые к этому серверу.
  empty: Устройств пока нет.
