  key_title: Chiave del server (secret.key)
  key_hint: Cifra le chiavi degli archivi nel database e firma i token dei dispositivi. Non è nel backup del database — scaricala una volta e conservala separata dai backup (in un gestore di password, per esempio). Senza di essa, un backup ripristinato su un nuovo server non può leggere le sue chiavi S3/R2.
  key_where: "Sul server:"
  key_download: Scarica secret.key
  delete_one: Elimina
  delete_confirm: Eliminare questo backup automatico?
  auto_title: Backup automatici
  auto_hint: Il server salva una copia prima di ogni aggiornamento dello schema del database. Vengono conservati gli ultimi %{keep}.
  auto_empty: Ancora nessun backup automatico — il primo comparirà con il primo aggiornamento del server.
  download_one: Scarica
  restore_one: Ripristina
  restore_title: Ripristina da un file
  restore_hint: Carica un backup scaricato in precedenza da questo server. Il database attuale viene prima salvato nei backup automatici, quindi un ripristino si può annullare allo stesso modo. Potrebbe essere necessario accedere di nuovo.
