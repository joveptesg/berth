backup:
  section: Backup
  now_title: Backup do banco de dados
  now_hint: Uma cópia da biblioteca, dos usuários, dispositivos, progresso e configurações neste momento. Os arquivos de áudio não estão nela — eles ficam nos armazenamentos.
  download: Baixar backup do banco de dados
  key_title: Chave do servidor (secret.key)
  key_hint: Ela criptografa as chaves dos armazenamentos no banco de dados e assina os tokens dos dispositivos. Ela não está no backup do banco de dados — baixe-a uma vez e guarde-a separada dos backups (em um gerenciador de senhas, por exemplo). Sem ela, um backup restaurado em um novo servidor não consegue ler as chaves S3/R2.
  key_where: "No servidor:"
  key_download: Baixar secret.key
  delete_one: Excluir
  delete_confirm: Excluir este backup automático?
  auto_title: Backups automáticos
  auto_hint: O servidor salva uma cópia antes de cada atualização do esquema do banco de dados. Os últimos %{keep} são mantidos.
  auto_empty: Nenhum backup automático ainda — o primeiro aparece com a primeira atualização do servidor.
  download_one: Baixar
  restore_one: Restaurar
  restore_title: Restaurar de um arquivo
  restore_hint: Envie um backup baixado antes deste servidor. O banco de dados atual é salvo primeiro nos backups automáticos, então a restauração pode ser desfeita do mesmo jeito. Talvez você precise entrar de novo depois.
  restore_submit: Restaurar
  restore_confirm: Substituir todo o banco de dados pelo backup? O estado atual é salvo nos backups automáticos.
  restored: O banco de dados foi restaurado do backup. O estado anterior à restauração está nos backups automáticos.
  restore_section: Restauração
  restore_pick: Escolha um arquivo de backup (.sqlite)
  restore_auto_title: Restaurar um backup automático
  restore_auto_hint: Cópias que o próprio servidor fez antes de atualizações e restaurações.
  col_date: Data
  col_size: Tamanho
  col_actions: Ações

ai:
  section: IA
  intro: "A IA escreve descrições curtas dos livros e encontra o ano da primeira publicação. Funciona com qualquer serviço com API compatível com OpenAI: OpenAI, OpenRouter, DeepSeek ou um Ollama local."
  connection_title: Conexão
  connection_hint: Endereço da API, chave e modelo. A chave é guardada criptografada.
  base_url_label: Endereço da API
  base_url_hint: "Por exemplo: https://api.openai.com/v1, https://openrouter.ai/api/v1, http://localhost:11434/v1 (Ollama)."
  model_label: Modelo
  key_label: Chave de API
  key_keep: Salva — deixe vazio para mantê-la
  key_hint: Um modelo local não precisa de chave.
  key_clear: Remover a chave salva
  prompt_label: Instrução para a IA
  prompt_reset: Restaurar padrão
  prompt_hint: "{language} vira o idioma do livro (o idioma da interface, para um livro sem idioma). O próprio servidor adiciona os dados do livro e o formato da resposta."
