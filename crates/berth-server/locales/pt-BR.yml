  fill_failed: "A IA não respondeu:"
  ai_filled: A IA preencheu os campos vazios. Confira e salve.
  ai_unknown: A IA não conhece este livro — preencha você mesmo.

remote_backup:
  title: Backup automático no armazenamento
  hint: "Uma vez por dia, o servidor coloca uma cópia do banco de dados no bucket, junto dos arquivos de áudio. Um novo servidor só precisa do mesmo bucket conectado para restaurar a biblioteca a partir dele. As cópias são mantidas por %{days} dias na pasta"
  enabled: Fazer backup todos os dias
  enabled_hint: "As cópias dos últimos %{days} dias são mantidas, e a mais recente sempre. Os backups automáticos locais continuam como estão."
  storage_label: Armazenamento
  now: Fazer backup agora
  running: Copiando…
  last_ok: "Último backup:"
  last_failed: "Falha no backup:"
  no_bucket: Isto requer um armazenamento S3 (S3, R2, MinIO…) — uma pasta local fica no mesmo disco que o banco de dados.
  to_storage: Conectar armazenamento
  restore_title: Restaurar do armazenamento
  restore_hint: Para um novo servidor — primeiro conecte o mesmo bucket em Armazenamento, depois encontre os backups nele e escolha um.
  restore_no_bucket: Conecte o armazenamento S3 que contém os backups.
  find: Encontrar backups
  finding: Procurando…
  list_failed: "Não foi possível ler o bucket:"
  none_found: "Este bucket não tem backups (pasta %{prefix}/)."
  col_server: Servidor
  this_server: Este servidor
  secret_label: secret.key do servidor antigo (opcional)
  secret_placeholder: 64 caracteres hexadecimais
  secret_hint: Com ela, as chaves de todos os armazenamentos e da IA são recuperadas. Sem ela, só as chaves deste bucket; nos outros armazenamentos, será preciso informar as chaves de novo.

