  checking: Verificando…
  check_ok: A conexão funciona.
  check_failed: "Não foi possível conectar:"
  run_title: Descrições dos livros
  run_hint: A IA preenche só as descrições e os anos vazios — o que você mesmo escreveu fica como está. Os celulares recebem as descrições na próxima sincronização.
