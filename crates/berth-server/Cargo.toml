[package]
name = "berth-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
accept-language = "3.1.0"
aes-gcm = "0.11.1"
anyhow = "1.0.104"
arc-swap = "1.9.3"
argon2 = "0.6.0"
async-trait = "0.1.92"
aws-credential-types = "1.3.1"
aws-sigv4 = "1.6.2"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
berth-core = { version = "1.0.12", path = "../berth-core" }
bytes = "1.12.1"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
minijinja = { version = "3.0.2", features = ["json", "serde"] }
object_store = { version = "0.14.2", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rust-embed = "8.13.0"
rust-i18n = "4.2.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
subtle = "2.6.1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "isomp4", "id3v2", "id3v1", "ape"] }
tokio = { version = "1.54.1", features = ["time", "rt", "io-util", "sync", "fs"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "cors", "trace"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test", "toml", "env"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["minio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = "0.3.23"
