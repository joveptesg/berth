{% extends "base.html" %}
{% import "partials/ui.html" as ui %}
{% block title %}{{ t('users.title') }}{% endblock %}
{% block content %}
<header class="flex flex-wrap items-end justify-between gap-4">
  <div class="min-w-0 max-w-[60ch]">
    <h1 class="text-[34px] leading-tight font-bold tracking-[-0.025em]">{{ t('users.title') }}</h1>
    <p class="mt-1 text-[16px] text-text-2">{{ t('users.subtitle') }}</p>
  </div>
  <button type="button" onclick="document.getElementById('add-user').showModal()" class="btn btn-primary">{{ ui.icon("plus", "size-[18px]") }}{{ t('users.add_title') }}</button>
</header>

{% include "partials/users_section.html" %}
{% endblock %}
