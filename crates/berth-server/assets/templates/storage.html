{% extends "base.html" %}
{% import "partials/ui.html" as ui %}
{% block title %}{{ t('storage.title') }}{% endblock %}
{% block content %}
<header class="flex flex-wrap items-end justify-between gap-4">
  <div class="min-w-0 max-w-[60ch]">
    <h1 class="text-[34px] leading-tight font-bold tracking-[-0.025em]">{{ t('storage.title') }}</h1>
    <p class="mt-1 text-[16px] text-text-2">{{ t('storage.subtitle') }}</p>
  </div>
  <div class="flex flex-wrap gap-2">
    <button type="button" onclick="document.getElementById('r2-storage').showModal()" class="btn btn-ghost">{{ ui.icon("cloud", "size-[18px]") }}{{ t('r2.open') }}</button>
    <button type="button" onclick="document.getElementById('add-storage').showModal()" class="btn btn-primary">{{ ui.icon("plus", "size-[18px]") }}{{ t('storage.add_title') }}</button>
  </div>
</header>

{% include "partials/storage_section.html" %}
{% endblock %}
