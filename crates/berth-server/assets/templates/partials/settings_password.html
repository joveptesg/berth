<form id="settings-password" method="post" action="/settings/password" hx-post="/settings/password" hx-target="this" hx-swap="outerHTML" class="card flex flex-col gap-5">
  <div>
    <h2 class="text-[22px] font-bold">{{ t('settings.password_section') }}</h2>
    <p class="mt-1 text-[14px] text-text-3">{{ t('settings.password_hint') }}</p>
  </div>
  {% if password_error %}<p class="alert-error" role="alert">{{ t('errors.' ~ password_error) }}</p>{% endif %}
  <div>
    <label for="current" class="field-label">{{ t('settings.current_label') }}</label>
    <input id="current" name="current" type="password" required autocomplete="current-password" class="input">
  </div>
  <div class="grid gap-5 sm:grid-cols-2">
    <div>
      <label for="new-password" class="field-label">{{ t('settings.new_label') }}</label>
      <input id="new-password" name="password" type="password" required minlength="10" autocomplete="new-password" class="input">
    </div>
    <div>
      <label for="confirm" class="field-label">{{ t('settings.confirm_label') }}</label>
      <input id="confirm" name="confirm" type="password" required minlength="10" autocomplete="new-password" class="input">
    </div>
  </div>
  <p class="field-hint -mt-2">{{ t('setup.password_hint', min=10) }}</p>
  <div class="flex flex-wrap items-center gap-3">
    <button type="submit" class="btn btn-primary">{{ t('settings.password_submit') }}</button>
    {% if password_saved %}<span class="alert-ok py-2" role="status">{{ t('settings.password_saved') }}</span>{% endif %}
  </div>
</form>
