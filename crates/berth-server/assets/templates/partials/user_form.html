<form id="user-form" method="post" action="/users" hx-post="/users" hx-target="this" hx-swap="outerHTML" class="card flex flex-col gap-4">
  <div>
    <h2 class="text-[22px] font-bold">{{ t('users.add_title') }}</h2>
    <p class="mt-1 text-[14px] text-text-3">{{ t('users.add_hint') }}</p>
  </div>
  {% if error %}<p class="alert-error" role="alert">{{ t('errors.' ~ error) }}</p>{% endif %}
  <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
    <div class="flex-1">
      <label for="user-name" class="field-label">{{ t('users.name_label') }}</label>
      <input id="user-name" name="name" value="{{ name or '' }}" required maxlength="64" autocomplete="off" placeholder="{{ t('users.name_placeholder') }}" class="input">
    </div>
    <button type="submit" class="btn btn-primary">{{ t('users.add_submit') }}</button>
  </div>
</form>
