<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ assets }}">
<link rel="preload" href="/static/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/admin.css?v={{ assets }}">
<script>
  // Apply the theme before first paint: light | dark | system (default).
  (function () {
    var theme = 'system';
    try { theme = localStorage.getItem('berth-theme') || 'system'; } catch (e) {}
    var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
  })();
  document.addEventListener('alpine:init', function () {
    Alpine.data('admin', function () {
      return {
        menu: false,
        // On phones the closed drawer is inert: hidden from screen readers and Tab.
        desktop: matchMedia('(min-width: 64rem)').matches,
        init: function () {
          var self = this;
          matchMedia('(min-width: 64rem)').addEventListener('change', function (e) {
            self.desktop = e.matches;
            if (e.matches) self.menu = false;
          });
        },
        theme: (function () { try { return localStorage.getItem('berth-theme') || 'system'; } catch (e) { return 'system'; } })(),
        setTheme: function (theme) {
          this.theme = theme;
          try { localStorage.setItem('berth-theme', theme); } catch (e) {}
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        },
        setLocale: function (locale) {
          document.cookie = 'berth_locale=' + locale + '; path=/; max-age=31536000; samesite=lax';
          location.reload();
        },
      };
    });
  });
</script>
<script>
  // <time data-ts="epoch ms">: date and time in the browser's zone and the page language.
  (function () {
    function format(root) {
      var fmt = new Intl.DateTimeFormat(document.documentElement.lang, { dateStyle: 'medium', timeStyle: 'short' });
      root.querySelectorAll('time[data-ts]').forEach(function (el) {
        var date = new Date(Number(el.dataset.ts));
        el.dateTime = date.toISOString();
        el.textContent = fmt.format(date);
      });
    }
    document.addEventListener('DOMContentLoaded', function () { format(document); });
    document.addEventListener('htmx:afterSettle', function (e) { format(e.target); });
  })();
</script>
<template id="confirm-dialog">
  <dialog class="m-auto w-[min(100%-32px,440px)] overflow-hidden rounded-card border border-line bg-surface p-0 text-text shadow-[0_24px_60px_-28px_rgb(14_16_20/0.5)] backdrop:bg-black/45">
    <form method="dialog">
      <p data-question class="px-6 pt-6 pb-5 text-[16px] leading-snug"></p>
      <div class="flex justify-end gap-2 border-t border-line bg-surface-2/40 px-6 py-3.5">
        <button value="" class="btn btn-ghost min-h-11 px-4 sm:px-5">{{ t('users.cancel') }}</button>
        <button value="ok" class="btn btn-danger min-h-11 px-4 sm:px-5">{{ t('common.confirm') }}</button>
      </div>
    </form>
  </dialog>
</template>
<script>
  // hx-confirm in the admin's own dialog instead of the browser's confirm().
  document.addEventListener('htmx:confirm', function (e) {
    if (!e.detail.question) return;
    e.preventDefault();
    var dialog = document.getElementById('confirm-dialog').content.firstElementChild.cloneNode(true);
    dialog.querySelector('[data-question]').textContent = e.detail.question;
    dialog.addEventListener('close', function () {
      dialog.remove();
      if (dialog.returnValue === 'ok') e.detail.issueRequest(true);
    });
    document.body.appendChild(dialog);
    dialog.showModal();
  });
</script>
<script src="/static/htmx.min.js?v={{ assets }}" defer></script>
<script src="/static/alpine.min.js?v={{ assets }}" defer></script>
